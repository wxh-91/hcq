<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ECHO 终端</title>
  <style>
    /* ===== 重置与基础 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      color: #1E293B;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== 消息容器 ===== */
    #message-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
      background: #FFFFFF;
    }

    /* ===== 消息气泡 ===== */
    .message {
      padding: 10px 16px;
      border-radius: 0;           /* 直角，无圆角 */
      max-width: 85%;
      margin-bottom: 2px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
      border: 1px solid transparent;
    }

    /* 用户消息：右对齐，蓝色背景，白色文字，蓝色边框 */
    .message.user {
      align-self: flex-end;
      background: #2563EB;
      color: #FFFFFF;
      border-color: #2563EB;
    }

    /* AI消息：左对齐，浅灰背景，深色文字，浅灰边框 */
    .message.assistant {
      align-self: flex-start;
      background: #F1F5F9;
      color: #1E293B;
      border-color: #E2E8F0;
    }

    /* 系统消息：居中，灰色小字，无背景，无边框 */
    .message.system {
      align-self: center;
      background: transparent;
      color: #94A3B8;
      font-size: 13px;
      max-width: 95%;
      border: none;
      padding: 6px 0;
    }

    /* 错误消息：左对齐，红色边框，浅红背景 */
    .message.error {
      align-self: flex-start;
      background: #FEF2F2;
      color: #EF4444;
      border-color: #EF4444;
      font-family: monospace;
    }

    /* ===== 占位（初始状态） ===== */
    .placeholder {
      color: #94A3B8;
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
      align-self: center;
    }

    /* ===== 输入区 ===== */
    #input-area {
      background: #FFFFFF;
      border-top: 1px solid #E2E8F0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    #input-row-main {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #cmd-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 0;           /* 直角 */
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      background: #F8FAFC;
      resize: none;
      overflow-y: auto;
      min-height: 42px;
      max-height: 120px;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    #cmd-input:focus {
      border-color: #2563EB;
      background: #FFFFFF;
    }

    #send-btn {
      padding: 10px 20px;
      min-height: 42px;
      border-radius: 0;           /* 直角 */
      font-size: 14px;
      font-weight: 500;
      background: #2563EB;
      color: white;
      border: 1px solid #2563EB;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #1D4ED8; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #input-row-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }

    .chain-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #64748B;
      flex-shrink: 0;
      user-select: none;
    }

    .chain-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563EB;
    }

    /* ===== 连接状态指示器 ===== */
    #connection-status {
      position: fixed;
      top: 12px;
      right: 16px;
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 4px 12px;
      z-index: 100;
      pointer-events: none;
      border-radius: 0;
    }

    #connection-status.online { background: rgba(34,197,94,0.85); }
    #connection-status.offline { background: rgba(239,68,68,0.85); }
  </style>
</head>
<body>
  <!-- 连接状态 -->
  <div id="connection-status" class="offline">● 离线</div>

  <!-- 消息容器 -->
  <div id="message-container">
    <div class="placeholder" id="placeholder">等待指令...</div>
  </div>

  <!-- 输入区 -->
  <div id="input-area">
    <div id="input-row-main">
      <textarea id="cmd-input" rows="1" placeholder="输入指令..." autofocus></textarea>
      <button id="send-btn" disabled>发送</button>
    </div>
    <div id="input-row-actions">
      <label class="chain-toggle">
        <input type="checkbox" id="planning-mode" checked>
        <span>规划模式</span>
      </label>
    </div>
  </div>

  <script>
    // ============================================================
    // 配置
    // ============================================================
    const CONFIG = {
      wsBase: window.location.protocol === 'https:' ? 'wss:' : 'ws:',
      wsPath: '/ws',
      reconnectDelay: 3000,
    };

    // ============================================================
    // DOM 引用
    // ============================================================
    const container = document.getElementById('message-container');
    const placeholder = document.getElementById('placeholder');
    const statusIndicator = document.getElementById('connection-status');
    const cmdInput = document.getElementById('cmd-input');
    const sendBtn = document.getElementById('send-btn');
    const planningMode = document.getElementById('planning-mode');

    // ============================================================
    // 状态
    // ============================================================
    const state = {
      socket: null,
      isConnected: false,
    };

    // ============================================================
    // 消息渲染（核心：只渲染文本，不解析）
    // ============================================================
    function appendMessage(type, content) {
      // 移除占位
      if (placeholder) placeholder.remove();

      const div = document.createElement('div');
      div.className = `message ${type}`;
      div.textContent = content;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // ============================================================
    // WebSocket
    // ============================================================
    function connectWebSocket() {
      if (state.socket?.readyState === WebSocket.OPEN) return;
      // 从 localStorage 读取已有的 session_id
      const sessionId = localStorage.getItem('session_id') || '';
      const url = `${CONFIG.wsBase}//${window.location.host}${CONFIG.wsPath}?session_id=${sessionId}`;
      state.socket = new WebSocket(url);
      state.socket.onopen = () => {
        state.isConnected = true;
        statusIndicator.textContent = '● 在线';
        statusIndicator.className = 'online';
        sendBtn.disabled = false;
        appendMessage('system', '已连接到服务器');
      };
      state.socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleMessage(data);
        } catch (e) {
          appendMessage('error', `解析消息失败: ${e.message}`);
        }
      };
      state.socket.onclose = () => {
        state.isConnected = false;
        statusIndicator.textContent = '● 离线';
        statusIndicator.className = 'offline';
        sendBtn.disabled = true;
        appendMessage('system', '连接断开，正在重连...');
        setTimeout(connectWebSocket, CONFIG.reconnectDelay);
      };
      state.socket.onerror = () => {
        state.socket?.close();
      };
    }

    // ============================================================
    // 消息处理器（仅按 type 套样式，不解析 content）
    // ============================================================
    function handleMessage(data) {
      const type = data.type || 'assistant';
      const content = data.content || data.msg || '';

      // 映射 type → 气泡类
      let cls = 'assistant';
      if (type === 'system') {
          // 检查 content 中是否包含 "(会话: xxx)"
          const match = content.match(/\(会话:\s*([a-f0-9-]+)\)/);
          if (match) {
              localStorage.setItem('session_id', match[1]);
          }
          appendMessage('system', content);
      }
      else if (type === 'system') cls = 'system';
      else if (type === 'error') cls = 'error';
      else if (type === 'assistant') cls = 'assistant';
      else cls = 'assistant'; // 未知类型归为 assistant

      appendMessage(cls, content);
    }

    // ============================================================
    // 发送指令
    // ============================================================
    function sendCommand() {
      const text = cmdInput.value.trim();
      if (!text) return;
      if (!state.isConnected) {
        appendMessage('error', '未连接到服务器');
        return;
      }

      // 本地显示用户消息（右对齐蓝色）
      appendMessage('user', text);

      const payload = { text };
      if (planningMode.checked) payload.type = 'chain';
      state.socket.send(JSON.stringify(payload));
      cmdInput.value = '';
      cmdInput.style.height = 'auto';
    }

    // ============================================================
    // 输入框自适应高度
    // ============================================================
    cmdInput.addEventListener('input', () => {
      cmdInput.style.height = 'auto';
      cmdInput.style.height = Math.min(cmdInput.scrollHeight, 120) + 'px';
    });

    // ============================================================
    // 事件绑定
    // ============================================================
    sendBtn.addEventListener('click', sendCommand);
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCommand();
      }
    });

    // ============================================================
    // 页面卸载
    // ============================================================
    window.addEventListener('beforeunload', () => {
      if (state.socket) {
        state.socket.close();
        state.socket = null;
      }
    });

    // ============================================================
    // 初始化
    // ============================================================
    connectWebSocket();
    cmdInput.focus();
    appendMessage('system', '终端就绪');
  </script>
</body>
</html>
