[project]
name = "aioverse"
version = "0.4.5"
description = "基于aiohttp实现的openai请求库，支持工具调用+上下文管理+密钥轮询"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.11",
    "aiofiles==25.1.0",
    "orjson==3.11.9",
    "pydantic==2.13.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aioverse"]
