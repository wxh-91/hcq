[project]
name = "aioclaw"
version = "0.2.3"
description = "基于 aioverse 构建的 AI Agent 框架"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
	"orjson>=3.11.9",
	"pydantic>=2.13.4",
	"aiofiles>=25.1.0",
	"aiohttp>=3.11",
	"httpx",
	"trafilatura==2.0.0",
	"fake-useragent",
	"asyncstdlib==3.14.0",
	"python-frontmatter",
	"aioverse>=0.4.5",
	"tiktoken>=0.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aioclaw"]